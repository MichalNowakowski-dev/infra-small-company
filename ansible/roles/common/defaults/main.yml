common_packages:
  - vim
  - curl
  - git
  - htop
  - tmux
  - net-tools
  - dnsutils
  - rsync
  - chrony

common_timezone: Europe/Warsaw

common_ssh_permit_root_login: "no"
common_ssh_password_auth: "no"
common_ssh_max_auth_tries: 3
common_ssh_allow_tcp_forwarding: "no"
common_ssh_allow_users:
  - vagrant
