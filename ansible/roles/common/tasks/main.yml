---
- name: Zainstaluj pakiety bazowe
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true

- name: Ustaw strefę czasową
  community.general.timezone:
    name: "{{ common_timezone }}"

- name: Włącz i uruchom chrony (NTP)
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true

- name: Wgraj hardening sshd (drop-in)
  ansible.builtin.template:
    src: sshd_hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Sprawdź konfigurację sshd
    - Restart sshd

- name: Utworz uzytkownika admina i dodaj do grupy sudo
  ansible.builtin.user:
    name: "{{ common_admin_name }}"
    password: "{{ common_admin_password_hash }}"
    groups: sudo
    append: true
    create_home: true
    shell: /bin/bash
    update_password: on_create
- name: Dodaj klucz publiczny admina
  ansible.posix.authorized_key:
    user: "{{ common_admin_name }}"
    state: present
    key: "{{ lookup('file', common_admin_pubkey_file) }}"
